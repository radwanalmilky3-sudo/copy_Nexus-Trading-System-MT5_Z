# Bare `pytest` must match the official regression command `pytest tests`
# (T-011/N3 cycle, 2026-11-05). Without testpaths a bare run also collects
# fx-trading-system-main/ — a foreign reference repo committed since the
# first upload — whose conftest imports its own fx_system package and aborts
# the whole collection. Scoped config keeps every invocation deterministic.
[pytest]
testpaths = tests
