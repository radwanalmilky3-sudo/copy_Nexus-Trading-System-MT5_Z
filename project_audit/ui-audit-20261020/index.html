<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>متابعة التدقيق المرئي — Nexus</title><style>body{font:16px system-ui;background:#10131b;color:#e8eef7;margin:0;padding:24px}h1{font-size:24px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.card,section{border:1px solid #344157;border-radius:12px;padding:16px;margin:12px 0}b{font-size:25px;color:#6be6e0}small{color:#acb9cb}table{width:100%;border-collapse:collapse}td,th{text-align:right;border-bottom:1px solid #344157;padding:10px}a{color:#6be6e0}pre{white-space:pre-wrap}.warn{color:#f6cb74}</style><h1>لوحة متابعة التدقيق المرئي — منفصلة عن النظام</h1><p id="current"></p><div class="grid" id="metrics"></div><section><h2>التغطية حسب الصفحات</h2><table><thead><tr><th>الواجهة</th><th>الحالة</th><th>النتيجة / حدود الاختبار</th></tr></thead><tbody id="pages"></tbody></table></section><section><h2>المشكلات المؤكدة</h2><div id="findings"></div></section><section><h2>طلبات API الفاشلة</h2><pre id="failures"></pre></section><small id="updated"></small><script>const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function refresh(){try{const r=await fetch('state.json',{cache:'no-store'});if(!r.ok)throw Error(r.status);const s=await r.json();document.getElementById('current').textContent='نفحص الآن: '+s.current;document.getElementById('metrics').innerHTML=[['صفحات اكتُشفت',s.pages.length],['صفحات انتهت جولتها',s.pages.filter(p=>p.state==='reviewed').length],['مشكلات مؤكدة',s.findings.length],['إصلاحات منفذة',s.fixes],['فشل API مؤكد',s.apiFailures.length]].map(([a,b])=>'<div class="card">'+esc(a)+'<br><b>'+esc(b)+'</b></div>').join('');document.getElementById('pages').innerHTML=s.pages.map(p=>'<tr><td>'+esc(p.name)+'<br><small dir="ltr">'+esc(p.path)+'</small></td><td>'+esc(p.state)+'</td><td>'+esc(p.note)+'</td></tr>').join('');document.getElementById('findings').innerHTML=s.findings.map(f=>'<p class="warn">'+esc(f.id+' · '+f.title)+'<br><small>'+esc(f.evidence)+'</small></p>').join('')||'لا توجد نتائج مؤكدة بعد.';document.getElementById('failures').textContent=s.apiFailures.join('\n')||'لم يُؤكد فشل طلب بعد؛ هذا لا يعني أن كل الطلبات اختُبرت.';document.getElementById('updated').textContent='آخر تحديث للسجل: '+s.updated+' · reviewed تعني انتهاء الجولة المحددة، وليس اجتياز كل الوظائف أو اعتمادًا أمنيًا.'}catch(e){document.getElementById('updated').textContent='تعذر قراءة سجل التقدم: '+e.message}}refresh();setInterval(refresh,2000);</script></html>
